# — Model —
model_dim: 768
n_layer: 12
n_head: 6
sequence_length: 1024

# — Batching & Training —
batch_size: 512
device_batch_size: 64
num_iterations: 5100

# — Learning‐rate schedule —
warmup_ratio: 0.1
warmdown_ratio: 0.3

# — Optimizer & Hyperparameters —
mu: 0.95
weight_decay: 0.01

# — Validation & Checkpointing —
val_loss_every: 125
val_tokens: 10485760
save_every: 0

# — Weights & Biases logging —
wandb_project_name: Mousse
wandb_job_name: null
no_wandb: false

# — Distributed training —
dp_size: null      # data‐parallel size
fs_size: null      # FSDP size
tp_size: null      # tensor‐parallel size

# — Miscellaneous flags —
debug: false
no_compile: false
no_triton: false

optimizer: mousse
scalar_opt: lion
adjust_lr: spectral_norm
lr: 0.06
optimizer_debug: false

# — Mousse hyperparameters —
shampoo_epsilon: 1.0e-5
shampoo_update_freq: 10
shampoo_alpha: 0.125
shampoo_beta: 0.95
LR_correction: true
shampoo_norm: true
use_LorR: 0

# - Data -
data_dir: /iopsstor/scratch/cscs/maydin/scion/examples/modded-nanogpt/data/fineweb10B
